# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: 7204695b-7485-4989-863c-16cf6e4db155
  title: Jupyter Book 2 Workshop Template
  description: This description goes in the preface of the pdf output. 
  # keywords: []
  authors:
    - name: Freek Pols
    - name: Luuk Fröling
    - name: Robert Lanzafame
    - name: Kirstie Whitaker
    - name: Jim Madge
  license:
    content: CC-BY-4.0
  references:
    myst-guide: https://mystmd.org/guide

  date: 2025-10-20 # ${BUILD_DATE} 
  github: https://github.com/alsvrdl/PE-syllabus
  # Change this URL to your GitHub repository
  edit_url: 
  
  plugins:
    - https://github.com/TUD-JB-Templates/JB2_plugins/releases/download/experiment/experiment.mjs

  # exports and downloads
  exports:
    - format: typst
      template: https://github.com/myst-templates/plain_typst_book.git
      output: exports/book.pdf
      id: output-pdf
      cover: content/figures/logo.svg
      logo: content/figures/logo.svg
      logo_width: 5
      ToC_depth: 2

  # Jupyter Notebook configuration
  jupyter:
    binder:
      repo: https://github.com/alsvrdl/PE-syllabus

  toc:
    - file: index.md    
    - file: theory_syllabus.md
      children:
      - file: content/reader/Introduction
    - file: content/executable_test.ipynb
  abbreviations:
    JB2: Jupyter Book 2
    CI/CD: Continuous Integration/Continuous Deployment
    GHA: GitHub Actions
    GH: GitHub

    
site:
  template: book-theme
  options:
    favicon: content/figures/favicon.svg      # path to your favicon
    style: ./css/custom.css
    logo: content/figures/logo.svg            # path to your logo, shown top left at site
    folders: false
    hide_authors: true

  actions:
    - title: Feedback
      url: https://github.com/FreekPols/JB2_book_template/issues
